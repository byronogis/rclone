name: Build Windows test binary

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Test patched packages
        shell: pwsh
        run: |
          go test ./cmd/bisync -run 'Test(FileInfoEqualIndependentModtimes|RefreshTransferredMetadata|RefreshTransferredMetadataFailure)

      - name: Build rclone
        shell: pwsh
        run: go build -trimpath -o rclone-independent-modtimes.exe .

      - name: Show version
        shell: pwsh
        run: .\rclone-independent-modtimes.exe version

      - name: Upload Windows binary
        uses: actions/upload-artifact@v7
        with:
          name: rclone-independent-modtimes-windows-amd64
          path: rclone-independent-modtimes.exe
          if-no-files-found: error
          retention-days: 14

          go test ./backend/webdav -run '^TestTrustServerModTime

      - name: Build rclone
        shell: pwsh
        run: go build -trimpath -o rclone-independent-modtimes.exe .

      - name: Show version
        shell: pwsh
        run: .\rclone-independent-modtimes.exe version

      - name: Upload Windows binary
        uses: actions/upload-artifact@v7
        with:
          name: rclone-independent-modtimes-windows-amd64
          path: rclone-independent-modtimes.exe
          if-no-files-found: error
          retention-days: 14


      - name: Build rclone
        shell: pwsh
        run: go build -trimpath -o rclone-independent-modtimes.exe .

      - name: Show version
        shell: pwsh
        run: .\rclone-independent-modtimes.exe version

      - name: Upload Windows binary
        uses: actions/upload-artifact@v7
