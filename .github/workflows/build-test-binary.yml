name: Build Windows test binary

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Build rclone
        shell: pwsh
        run: go build -trimpath -o rclone-independent-modtimes.exe .

      - name: Show version
        shell: pwsh
        run: .\rclone-independent-modtimes.exe version

      - name: Verify independent modtimes flag
        shell: pwsh
        run: |
          .\rclone-independent-modtimes.exe bisync --help |
            Select-String -SimpleMatch -- "--independent-modtimes" -Quiet |
            ForEach-Object {
              if (-not $_) {
                throw "bisync --independent-modtimes flag not found"
              }
            }

      - name: Upload Windows binary
        uses: actions/upload-artifact@v7
        with:
          name: rclone-independent-modtimes-windows-amd64
          path: rclone-independent-modtimes.exe
          if-no-files-found: error
          retention-days: 14
